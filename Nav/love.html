<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nature Slot 🌿</title>
  <link rel="stylesheet" href="../Style/love.css">
</head>
<body>
  <main class="stage">
    <div class="machine">
      <div class="top-sign">WIN ♥ NATURE</div>

      <div class="screen">
        <div class="reels">
          <div class="reel" id="reel1">🍃</div>
          <div class="reel" id="reel2">🌸</div>
          <div class="reel" id="reel3">🌞</div>
        </div>
      </div>

      <div class="control">
        <div class="buttons">
          <div class="btn small"></div>
          <div class="btn small"></div>
          <div class="btn small"></div>
        </div>
        <div class="drawer">
          <div class="drawer-slot"></div>
        </div>
      </div>

      <div class="lever-wrap">
        <button id="lever" class="lever" aria-label="Pull Lever">
          <span class="knob"></span>
        </button>
      </div>

      <div id="hearts" class="hearts"></div>

      <div class="message-box" id="messageBox" aria-live="polite">
        <div id="typing" class="typing"></div>
      </div>

      <div class="back-btn-box">
        <a href="../Nav/games.html" class="back-btn">Back</a>
      </div>
    </div>
  </main>

  <audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2021/09/01/audio_46d9d69c69.mp3?filename=slot-machine-pull-handle-91858.mp3"></audio>
  <audio id="winSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_80ccefa0b1.mp3?filename=success-1-6297.mp3"></audio>

  <script src="../Style/love.js"></script>
</body>
</html>
